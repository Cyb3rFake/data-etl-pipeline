version: '3.8'

services:
  postgres:
    image: postgres:13
    environment:
      POSTGRES_DB: etl_db
      POSTGRES_USER: etl_user
      POSTGRES_PASSWORD: etl_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  etl:
    build: .
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgresql://etl_user:etl_password@postgres:5432/etl_db
      LOG_LEVEL: INFO
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs

volumes:
  postgres_data:
